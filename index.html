<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0d10"
  >

  <meta
    name="description"
    content="T.M.D AI - مساعد ذكاء اصطناعي يعمل بواسطة Groq"
  >

  <title>T.M.D AI</title>

  <!-- ================= FONT ================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- ================= DOCX ================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"
  ></script>

  <!-- ================= STYLE ================= -->

  <style>

    :root {
      --bg: #070707;
      --bg2: #0d0d0d;
      --panel: #111111;
      --panel2: #171717;

      --border: rgba(255,38,38,.15);
      --border2: rgba(255,55,55,.28);

      --text: #f7f7f7;
      --muted: #a8a8a8;
      --muted2: #6e6e6e;

      --accent: #ff2020;
      --accent2: #b00000;

      --danger: #ff3b3b;

      --sidebar: #090909;

      --user: #1a0b0b;

      --radius: 18px;
    }

    [data-theme="light"] {
      --bg: #f6f7f9;
      --bg2: #ffffff;
      --panel: #ffffff;
      --panel2: #f0f2f4;

      --border: rgba(0,0,0,.08);
      --border2: rgba(0,0,0,.14);

      --text: #15181c;
      --muted: #69717b;
      --muted2: #89919a;

      --sidebar: #eef0f2;

      --user: #e9edf1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;

      font-family:
        "Cairo",
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);

      transition:
        background .2s ease,
        color .2s ease;
    }

    button,
    textarea,
    select,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    ::selection {
      background: rgba(33,196,123,.25);
    }

    /* ==================================================
       APP
    ================================================== */

    .app {
      width: 100%;
      height: 100vh;

      display: flex;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(33,196,123,.06),
          transparent 40%
        ),
        var(--bg);
    }

    /* ==================================================
       SIDEBAR
    ================================================== */

    .sidebar {
      width: 285px;
      min-width: 285px;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: var(--sidebar);

      border-left:
        1px solid var(--border);

      z-index: 100;

      transition:
        transform .25s ease;
    }

    .sidebar-header {
      height: 76px;

      padding: 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom:
        1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 11px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      color: #fff;

      font-size: 13px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #118955
        );

      box-shadow:
        0 8px 30px
        rgba(33,196,123,.18);
    }

    .brand-info {
      display: flex;
      flex-direction: column;

      line-height: 1.25;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
    }

    .brand-sub {
      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;
    }

    .icon-button {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: transparent;
      color: var(--muted);

      font-size: 18px;

      transition: .18s ease;
    }

    .icon-button:hover {
      background: var(--panel2);
      color: var(--text);
    }

    /* ==================================================
       NEW CHAT
    ================================================== */

    .new-chat {
      margin: 16px;

      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      border-radius: 13px;

      color: #07130d;

      background: var(--accent);

      font-size: 14px;
      font-weight: 800;

      transition: .18s ease;

      box-shadow:
        0 8px 25px
        rgba(33,196,123,.10);
    }

    .new-chat:hover {
      background: #2bd589;

      transform: translateY(-1px);
    }

    .new-chat span {
      font-size: 21px;
      line-height: 1;
    }

    /* ==================================================
       HISTORY
    ================================================== */

    .history-title {
      padding: 0 18px 10px;

      color: var(--muted2);

      font-size: 11px;
      font-weight: 700;
    }

    .history {
      flex: 1;

      overflow-y: auto;

      padding: 0 10px 12px;
    }

    .history::-webkit-scrollbar {
      width: 5px;
    }

    .history::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 10px;
    }

    .history-item {
      width: 100%;

      padding: 11px 12px;

      margin-bottom: 5px;

      border-radius: 11px;

      text-align: right;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      background: transparent;
      color: var(--muted);

      font-size: 12px;

      transition: .18s ease;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--panel2);
      color: var(--text);
    }

    .empty-history {
      padding: 20px 10px;

      text-align: center;

      color: var(--muted2);

      font-size: 12px;
    }

    /* ==================================================
       SIDEBAR FOOTER
    ================================================== */

    .sidebar-footer {
      padding: 12px;

      display: flex;
      gap: 7px;

      border-top:
        1px solid var(--border);
    }

    .footer-button {
      flex: 1;

      min-height: 40px;

      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      font-size: 12px;
    }

    .footer-button:hover {
      background: var(--panel2);
      color: var(--text);
    }

    /* ==================================================
       MAIN
    ================================================== */

    .main {
      min-width: 0;

      flex: 1;

      height: 100%;

      display: flex;
      flex-direction: column;

      background: var(--bg);
    }

    /* ==================================================
       TOPBAR
    ================================================== */

    .topbar {
      height: 66px;
      min-height: 66px;

      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom:
        1px solid var(--border);

      background:
        rgba(9,11,14,.78);

      backdrop-filter: blur(18px);

      z-index: 20;
    }

    [data-theme="light"] .topbar {
      background:
        rgba(246,247,249,.82);
    }

    .topbar-right {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mobile-menu {
      display: none;
    }

    /* ==================================================
       MODEL
    ================================================== */

    .model-selector {
      min-width: 170px;

      height: 40px;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 0 12px;

      border-radius: 12px;

      border:
        1px solid rgba(33,196,123,.20);

      background:
        rgba(33,196,123,.06);
    }

    .model-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 10px
        rgba(33,196,123,.65);
    }

    .model-selector select {
      width: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      font-size: 11px;
      font-weight: 700;

      cursor: pointer;
    }

    .model-selector select option {
      background: #14181d;
      color: #fff;
    }

    /* ==================================================
       CHAT
    ================================================== */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding:
        28px 20px 180px;
    }

    .chat::-webkit-scrollbar {
      width: 7px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 20px;
    }

    .chat-inner {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;
    }

    /* ==================================================
       WELCOME
    ================================================== */

    .welcome {
      min-height:
        calc(100vh - 230px);

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px 10px;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;

      display: grid;
      place-items: center;

      margin-bottom: 22px;

      border-radius: 23px;

      color: #fff;

      font-size: 18px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #118955
        );

      box-shadow:
        0 20px 60px
        rgba(33,196,123,.18);
    }

    .welcome h1 {
      font-size: 34px;

      font-weight: 800;

      letter-spacing: -.5px;
    }

    .welcome p {
      max-width: 620px;

      margin-top: 10px;

      color: var(--muted);

      font-size: 13px;

      line-height: 2;
    }

    /* ==================================================
       WELCOME CARDS
    ================================================== */

    .welcome-cards {
      width: 100%;

      margin-top: 35px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;
    }

    .welcome-card {
      min-height: 135px;

      padding: 20px;

      display: flex;
      flex-direction: column;

      align-items: flex-start;

      text-align: right;

      border:
        1px solid var(--border);

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          var(--panel),
          rgba(20,24,29,.70)
        );

      transition: .2s ease;
    }

    .welcome-card:hover {
      transform: translateY(-3px);

      border-color:
        rgba(33,196,123,.25);

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.20);
    }

    .welcome-card-icon {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      margin-bottom: 12px;

      border-radius: 11px;

      background:
        rgba(33,196,123,.10);

      font-size: 18px;
    }

    .welcome-card strong {
      font-size: 13px;
    }

    .welcome-card span {
      margin-top: 7px;

      color: var(--muted);

      font-size: 10px;

      line-height: 1.8;
    }

    /* ==================================================
       MESSAGES
    ================================================== */

    .message {
      display: flex;

      gap: 12px;

      margin-bottom: 28px;

      animation:
        messageIn .22s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-avatar {
      width: 34px;
      min-width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--panel2);

      color: var(--text);

      font-size: 10px;
      font-weight: 800;
    }

    .message.assistant .msg-avatar {
      background:
        linear-gradient(
          135deg,
          var(--accent),
          #128a54
        );

      color: #fff;
    }

    .msg-body {
      min-width: 0;
      flex: 1;

      padding-top: 2px;
    }

    .msg-label {
      display: flex;
      align-items: center;

      gap: 8px;

      margin-bottom: 7px;

      font-size: 11px;
      font-weight: 800;
    }

    .msg-label span {
      color: var(--muted2);

      font-size: 9px;
      font-weight: 500;
    }

    .msg-content {
      color: var(--text);

      font-size: 13px;

      line-height: 2;

      overflow-wrap: anywhere;
    }

    .message.user {
      padding: 13px 15px;

      border-radius: 16px;

      background: var(--user);

      border:
        1px solid var(--border);
    }

    .message.user .msg-content {
      color: var(--text);
    }

    .msg-content pre {
      margin: 12px 0;

      padding: 15px;

      overflow-x: auto;

      direction: ltr;
      text-align: left;

      border-radius: 12px;

      background: #080a0d;

      border:
        1px solid rgba(255,255,255,.08);

      font-family:
        Consolas,
        Monaco,
        monospace;

      font-size: 12px;

      line-height: 1.7;
    }

    .inline-code {
      padding: 2px 6px;

      border-radius: 6px;

      background: var(--panel2);

      font-family: monospace;
    }

    .error-text {
      color: var(--danger);
    }

    /* ==================================================
       COMPOSER
    ================================================== */

    .composer-wrap {
      position: fixed;

      right: 285px;
      left: 0;
      bottom: 0;

      padding:
        18px 20px 18px;

      z-index: 40;

      background:
        linear-gradient(
          to top,
          var(--bg) 55%,
          transparent
        );
    }

    .composer-inner {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;
    }

    /* ==================================================
       ATTACHMENT PREVIEW
    ================================================== */

    .attachment-preview {
      margin-bottom: 9px;

      padding: 10px 12px;

      display: flex;
      align-items: center;

      gap: 10px;

      border:
        1px solid var(--border);

      border-radius: 13px;

      background: var(--panel);
    }

    .attachment-icon {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background:
        rgba(33,196,123,.10);
    }

    .attachment-info {
      min-width: 0;
      flex: 1;
    }

    .attachment-name {
      display: block;

      overflow: hidden;

      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 11px;
      font-weight: 700;
    }

    .attachment-meta {
      display: block;

      margin-top: 2px;

      color: var(--muted);

      font-size: 9px;
    }

    .remove-attachment {
      width: 32px;
      height: 32px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: transparent;

      color: var(--muted);

      font-size: 16px;
    }

    .remove-attachment:hover {
      background: rgba(239,83,80,.10);
      color: var(--danger);
    }

    /* ==================================================
       INPUT SHELL
    ================================================== */

    .input-shell {
      min-height: 62px;

      display: flex;
      align-items: flex-end;

      gap: 9px;

      padding: 9px;

      border:
        1px solid var(--border2);

      border-radius: 20px;

      background:
        rgba(20,24,29,.96);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.30);

      transition: .2s ease;
    }

    [data-theme="light"] .input-shell {
      background: rgba(255,255,255,.96);
    }

    .input-shell:focus-within {
      border-color:
        rgba(33,196,123,.35);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.25),
        0 0 0 3px
        rgba(33,196,123,.05);
    }

    .circle-button {
      width: 38px;
      min-width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        var(--panel2);

      color: var(--text);

      font-size: 21px;

      transition: .18s ease;
    }

    .circle-button:hover {
      transform: scale(1.04);

      background:
        rgba(33,196,123,.14);
    }

    .send-button {
      background: var(--accent);

      color: #07130d;

      font-size: 18px;
      font-weight: 900;
    }

    .send-button:hover {
      background: #2bd589;
    }

    .send-button.stop {
      background: var(--danger);
      color: #fff;
    }

    .input-area {
      flex: 1;

      min-width: 0;

      min-height: 40px;
      max-height: 180px;

      resize: none;

      border: 0;
      outline: 0;

      padding:
        8px 5px;

      background: transparent;

      color: var(--text);

      font-size: 13px;

      line-height: 1.8;
    }

    .input-area::placeholder {
      color: var(--muted2);
    }

    .composer-note {
      padding-top: 8px;

      text-align: center;

      color: var(--muted2);

      font-size: 9px;
    }

    /* ==================================================
       PLUS MENU
    ================================================== */

    .plus-menu-wrapper {
      position: relative;
    }

    .plus-menu {
      position: absolute;

      right: 0;
      bottom: 53px;

      width: 310px;

      padding: 8px;

      border:
        1px solid var(--border2);

      border-radius: 17px;

      background:
        rgba(20,24,29,.98);

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.45);

      backdrop-filter: blur(20px);

      animation:
        menuIn .18s ease;

      z-index: 200;
    }

    [data-theme="light"] .plus-menu {
      background:
        rgba(255,255,255,.98);
    }

    @keyframes menuIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .plus-menu-title {
      padding: 9px 11px;

      color: var(--muted2);

      font-size: 10px;
      font-weight: 700;
    }

    .plus-option {
      width: 100%;

      padding: 12px;

      display: flex;
      align-items: center;

      gap: 11px;

      border-radius: 12px;

      background: transparent;

      color: var(--text);

      text-align: right;

      transition: .16s ease;
    }

    .plus-option:hover {
      background: var(--panel2);
    }

    .plus-option-icon {
      width: 40px;
      min-width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background:
        rgba(33,196,123,.10);

      font-size: 18px;
    }

    .plus-option-content {
      min-width: 0;

      display: flex;
      flex-direction: column;

      align-items: flex-start;
    }

    .plus-option-title {
      font-size: 12px;
      font-weight: 800;
    }

    .plus-option-desc {
      margin-top: 2px;

      color: var(--muted);

      font-size: 9px;
    }

    /* ==================================================
       MODAL
    ================================================== */

    .modal-backdrop {
      position: fixed;

      inset: 0;

      display: grid;
      place-items: center;

      padding: 20px;

      background:
        rgba(0,0,0,.62);

      backdrop-filter: blur(7px);

      z-index: 500;
    }

    .modal {
      width: 100%;
      max-width: 460px;

      border:
        1px solid var(--border2);

      border-radius: 20px;

      overflow: hidden;

      background: var(--panel);

      box-shadow:
        0 30px 100px
        rgba(0,0,0,.45);
    }

    .modal-header {
      min-height: 62px;

      padding: 0 17px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom:
        1px solid var(--border);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
    }

    .modal-body {
      padding: 20px;
    }

    .setting {
      margin-bottom: 18px;
    }

    .setting:last-child {
      margin-bottom: 0;
    }

    .setting-label {
      display: block;

      margin-bottom: 8px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
    }

    .setting select {
      width: 100%;

      height: 44px;

      padding: 0 12px;

      outline: 0;

      border:
        1px solid var(--border2);

      border-radius: 11px;

      background: var(--panel2);

      color: var(--text);

      font-size: 12px;
    }

    /* ==================================================
       TOAST
    ================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 105px;

      transform:
        translateX(-50%)
        translateY(15px);

      padding:
        10px 17px;

      border:
        1px solid var(--border2);

      border-radius: 12px;

      background:
        rgba(20,24,29,.96);

      color: var(--text);

      font-size: 11px;

      opacity: 0;
      pointer-events: none;

      transition: .2s ease;

      z-index: 700;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* ==================================================
       HELPERS
    ================================================== */

    .hidden {
      display: none !important;
    }

    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 850px) {

      .sidebar {
        position: fixed;

        top: 0;
        bottom: 0;
        right: 0;

        transform:
          translateX(100%);

        box-shadow:
          -20px 0 60px
          rgba(0,0,0,.30);
      }

      .sidebar.open {
        transform:
          translateX(0);
      }

      .mobile-menu {
        display: grid;
      }

      .composer-wrap {
        right: 0;

        padding:
          10px 10px 14px;
      }

      .chat {
        padding:
          20px 12px 165px;
      }

      .welcome {
        min-height:
          calc(100vh - 220px);
      }

      .welcome-cards {
        grid-template-columns: 1fr;
      }

      .message {
        gap: 9px;
      }

          settingsModel.value =
            mainModel.value;


          mainModel.addEventListener(
            "change",
            () => {

              settingsModel.value =
                mainModel.value;

            }
          );


          settingsModel.addEventListener(
            "change",
            () => {

              mainModel.value =
                settingsModel.value;

              mainModel.dispatchEvent(
                new Event("change")
              );

            }
          );

        }


        if (
          desktopTheme &&
          themeButton
        ) {

          desktopTheme.addEventListener(
            "click",
            () => {

              themeButton.click();

            }
          );

        }

      }
    );

  </script>

</body>
