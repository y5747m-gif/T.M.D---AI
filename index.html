<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07080b"
  >

  <meta
    name="description"
    content="T.M.D_AI_Pro — مساعد ذكاء اصطناعي احترافي يعمل بواسطة Groq"
  >

  <title>T.M.D_AI_Pro</title>

  <!-- ================= FONTS ================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- ================= DOCX ================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"
  ></script>

  <!-- ================= STYLE ================= -->

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <!--
    منع وميض المظهر: يُطبَّق المظاهر المحفوظ قبل تحميل الصفحة.
  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tmd_theme");
        document.documentElement.dataset.theme =
          t === "light" ? "light" : "dark";
      } catch (e) {}
    })();
  </script>
</head>

<body data-theme="dark">

  <!-- ==================================================
       APP
  ================================================== -->

  <div class="app">

    <!-- ==================================================
         SIDEBAR
    ================================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-header">

        <div class="brand">

          <!-- الشعار مع انيميشن الطوافان -->
          <div class="orbit-logo orbit-logo--brand">

            <span class="orbit-ring orbit-ring--a" aria-hidden="true">
              <i class="orbit-sat"></i>
            </span>

            <span class="orbit-ring orbit-ring--b" aria-hidden="true">
              <i class="orbit-sat orbit-sat--b"></i>
            </span>

            <div class="orbit-logo-tile">
              T.M.D
            </div>

          </div>

          <div class="brand-info">

            <span class="brand-name">
              T.M.D_AI_
              <em class="brand-pro">Pro</em>
            </span>

            <span class="brand-sub">
              Professional · Groq
            </span>

          </div>

        </div>

        <button
          class="icon-button"
          id="closeSidebar"
          type="button"
          aria-label="إغلاق القائمة"
        >
          ×
        </button>

      </div>


      <button
        class="new-chat"
        id="newChat"
        type="button"
      >

        <span class="new-chat-icon">＋</span>

        <span>محادثة جديدة</span>

      </button>


      <div class="history-title">
        المحادثات
      </div>


      <div
        class="history"
        id="history"
      ></div>


      <div class="sidebar-footer">

        <button
          class="footer-button"
          id="settingsBtn"
          type="button"
        >
          <span class="footer-icon">⚙</span>
          الإعدادات
        </button>

        <button
          class="footer-button"
          id="themeTop"
          type="button"
        >
          <span class="footer-icon">◐</span>
          المظهر
        </button>

      </div>

    </aside>


    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="main">

      <!-- ==================================================
           TOPBAR
      ================================================== -->

      <header class="topbar">

        <div class="topbar-right">

          <button
            class="icon-button mobile-menu"
            id="openSidebar"
            type="button"
            aria-label="فتح القائمة"
          >
            ☰
          </button>


          <div class="model-selector">

            <span class="model-dot" aria-hidden="true"></span>

            <select
              id="modelSelect"
              aria-label="اختيار نموذج Groq"
            >

              <option
                value="openai/gpt-oss-20b"
              >
                T.M.D_AI_Pro Fast — GPT OSS 20B
              </option>

              <option
                value="openai/gpt-oss-120b"
              >
                T.M.D_AI_Pro — GPT OSS 120B
              </option>

              <option
                value="qwen/qwen3.8-27b"
              >
                T.M.D_AI_Pro Vision — Qwen 3.8 27B
              </option>

            </select>

          </div>


          <span
            class="model-badge"
            id="modelName"
          >
            T.M.D_AI_Pro
          </span>

        </div>


        <div class="top-actions">

          <button
            class="icon-button"
            id="themeTopDesktop"
            type="button"
            aria-label="تغيير المظهر"
          >
            ◐
          </button>

        </div>

      </header>


      <!-- ==================================================
           CHAT
      ================================================== -->

      <section
        class="chat"
        id="chat"
      >

        <!-- ==================================================
             WELCOME
        ================================================== -->

        <div
          class="welcome"
          id="welcome"
        >

          <!-- شعار الترحيب مع انيميشن الطوافان -->
          <div class="orbit-logo orbit-logo--hero">

            <span class="orbit-ring orbit-ring--a" aria-hidden="true">
              <i class="orbit-sat"></i>
            </span>

            <span class="orbit-ring orbit-ring--b" aria-hidden="true">
              <i class="orbit-sat orbit-sat--b"></i>
            </span>

            <div class="orbit-halo" aria-hidden="true"></div>

            <div class="orbit-logo-tile">
              T.M.D
            </div>

          </div>


          <h1 class="welcome-title">
            كيف يمكنني مساعدتك اليوم؟
          </h1>

          <p class="welcome-sub">
            مساعدك الذكي الاحترافي للمحادثة، تحليل الملفات،
            وفهم الصور — بسرعة Groq ودقة عالية.
          </p>


          <div class="welcome-cards">

            <button
              class="welcome-card"
              type="button"
              data-prompt="اشرح لي هذا الموضوع بالتفصيل وبطريقة بسيطة."
            >

              <div class="welcome-card-icon">
                💬
              </div>

              <strong>
                محادثة ذكية
              </strong>

              <span>
                اسأل أي سؤال واحصل على إجابة واضحة ومنظمة.
              </span>

            </button>


            <button
              class="welcome-card"
              type="button"
              data-prompt="حلل الملف المرفق واشرح أهم المعلومات الموجودة بداخله."
            >

              <div class="welcome-card-icon">
                📄
              </div>

              <strong>
                تحليل الملفات
              </strong>

              <span>
                PDF و DOCX و TXT والملفات النصية.
              </span>

            </button>


            <button
              class="welcome-card"
              type="button"
              data-prompt="حلل الصورة المرفقة واشرح لي كل ما يظهر فيها."
            >

              <div class="welcome-card-icon">
                🖼️
              </div>

              <strong>
                تحليل الصور
              </strong>

              <span>
                ارفع صورة واطلب من T.M.D_AI_Pro تحليل محتواها.
              </span>

            </button>

          </div>

        </div>

      </section>


      <!-- ==================================================
           COMPOSER
      ================================================== -->

      <div class="composer-wrap">

        <div class="composer-inner">


          <!-- ==================================================
               ATTACHMENT PREVIEW
          ================================================== -->

          <div
            class="attachment hidden"
            id="imagePreviewContainer"
          >

            <div class="attachment-thumb">

              <img
                id="imagePreview"
                alt="معاينة المرفق"
              >

              <span class="attachment-doc" aria-hidden="true">
                📄
              </span>

            </div>

            <div class="attachment-info">

              <span
                class="attachment-name"
                id="imageFileName"
              >
                الملف
              </span>

              <span
                class="attachment-mode"
                id="imageModeLabel"
              >
                تحليل الصورة
              </span>

            </div>

            <button
              class="attachment-remove"
              id="removeImage"
              type="button"
              aria-label="إزالة المرفق"
            >
              ×
            </button>

          </div>


          <!-- ==================================================
               INPUT SHELL
          ================================================== -->

          <div class="input-shell">

            <div class="plus-menu-wrapper">

              <button
                class="circle-button"
                id="plusButton"
                type="button"
                aria-label="إضافة ملف أو صورة"
                aria-expanded="false"
              >
                ＋
              </button>


              <!-- ==================================================
                   PLUS MENU
              ================================================== -->

              <div
                class="plus-menu hidden"
                id="plusMenu"
              >

                <div class="plus-menu-title">
                  إضافة إلى المحادثة
                </div>


                <button
                  class="plus-option"
                  id="analyzeDocumentButton"
                  type="button"
                >

                  <span class="plus-option-icon">
                    📄
                  </span>

                  <span class="plus-option-content">

                    <span class="plus-option-title">
                      تحليل ملف
                    </span>

                    <span class="plus-option-desc">
                      PDF و DOCX و TXT و JSON وغيرها
                    </span>

                  </span>

                </button>


                <button
                  class="plus-option"
                  id="addImageButton"
                  type="button"
                >

                  <span class="plus-option-icon">
                    🖼️
                  </span>

                  <span class="plus-option-content">

                    <span class="plus-option-title">
                      تحليل صورة
                    </span>

                    <span class="plus-option-desc">
                      تحليل الصورة وقراءة النصوص الظاهرة
                    </span>

                  </span>

                </button>


                <button
                  class="plus-option"
                  id="imageEditButton"
                  type="button"
                >

                  <span class="plus-option-icon">
                    ✨
                  </span>

                  <span class="plus-option-content">

                    <span class="plus-option-title">
                      وصف / تجهيز صورة
                    </span>

                    <span class="plus-option-desc">
                      إرسال الصورة مع تعليماتك
                    </span>

                  </span>

                </button>

              </div>

            </div>


            <textarea
              class="input-area"
              id="input"
              rows="1"
              placeholder="اكتب رسالتك إلى T.M.D_AI_Pro..."
              autocomplete="off"
              spellcheck="true"
            ></textarea>


            <button
              class="circle-button send-button"
              id="send"
              type="button"
              aria-label="إرسال"
            >
              ↑
            </button>

          </div>


          <div class="composer-note">
            T.M.D_AI_Pro يعمل بواسطة Groq · لا تشارك معلومات حساسة
          </div>

        </div>

      </div>

    </main>

  </div>


  <!-- ==================================================
       SETTINGS MODAL
  ================================================== -->

  <div
    class="modal-backdrop hidden"
    id="modalBackdrop"
  >

    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >

      <div class="modal-header">

        <div
          class="modal-title"
          id="settingsTitle"
        >
          إعدادات T.M.D_AI_Pro
        </div>

        <button
          class="icon-button"
          id="modalClose"
          type="button"
          aria-label="إغلاق"
        >
          ×
        </button>

      </div>


      <div class="modal-body">


        <div class="setting">

          <label
            class="setting-label"
            for="modelSelectSettings"
          >
            نموذج الذكاء الاصطناعي
          </label>

          <select
            id="modelSelectSettings"
          >

            <option
              value="openai/gpt-oss-20b"
            >
              T.M.D_AI_Pro Fast — GPT OSS 20B
            </option>

            <option
              value="openai/gpt-oss-120b"
            >
              T.M.D_AI_Pro — GPT OSS 120B
            </option>

            <option
              value="qwen/qwen3.8-27b"
            >
              T.M.D_AI_Pro Vision — Qwen 3.8 27B
            </option>

          </select>

        </div>


        <div class="setting">

          <label
            class="setting-label"
            for="themeSelect"
          >
            المظهر
          </label>

          <select
            id="themeSelect"
          >

            <option value="dark">
              داكن
            </option>

            <option value="light">
              فاتح
            </option>

          </select>

        </div>


      </div>

    </div>

  </div>


  <!-- ==================================================
       TOAST
  ================================================== -->

  <div
    class="toast"
    id="toast"
    role="status"
  ></div>


  <!-- ==================================================
       HIDDEN IMAGE INPUT
  ================================================== -->

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    hidden
  >


  <!-- ==================================================
       HIDDEN DOCUMENT INPUT
  ================================================== -->

  <input
    type="file"
    id="documentInput"
    accept=".pdf,.docx,.txt,.md,.js,.json,.html,.htm,.css,.py,.csv,.xml,.yaml,.yml,.log"
    hidden
  >


  <!-- ==================================================
       PDF.JS
  ================================================== -->

  <script type="module">

    try {

      const pdfjs =
        await import(
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs"
        );

      pdfjs.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.mjs";

      window.pdfjsLib =
        pdfjs;

      window.pdfjsReady =
        Promise.resolve(pdfjs);

    } catch (error) {

      console.error(
        "PDF.js initialization failed:",
        error
      );

      window.pdfjsReady =
        Promise.reject(error);

    }

  </script>


  <!-- ==================================================
       APPLICATION JAVASCRIPT
  ================================================== -->

  <script src="/app.js"></script>


  <!-- ==================================================
       UI SYNC
       مزامنة النموذج والمظهر + ربط أزرار المظهر
       وبطاقات الترحيب. لا يغير منطق Groq.
  ================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const mainModel =
          document.getElementById(
            "modelSelect"
          );

        const settingsModel =
          document.getElementById(
            "modelSelectSettings"
          );

        const themeSelect =
          document.getElementById(
            "themeSelect"
          );

        const desktopTheme =
          document.getElementById(
            "themeTopDesktop"
          );

        const sidebarTheme =
          document.getElementById(
            "themeTop"
          );


        /*
         * MOUNT MODEL SELECTS
         */

        if (
          mainModel &&
          settingsModel
        ) {

          settingsModel.value =
            mainModel.value;

          mainModel.addEventListener(
            "change",
            () => {

              settingsModel.value =
                mainModel.value;

            }
          );

          settingsModel.addEventListener(
            "change",
            () => {

              mainModel.value =
                settingsModel.value;

              mainModel.dispatchEvent(
                new Event("change")
              );

            }
          );

        }


        /*
         * THEME TOGGLE BUTTONS
         */

        const toggleTheme =
          () => {

            if (!themeSelect) {
              return;
            }

            const current =
              document.body.dataset.theme ===
              "light"
                ? "light"
                : "dark";

            themeSelect.value =
              current === "light"
                ? "dark"
                : "light";

            themeSelect.dispatchEvent(
              new Event("change")
            );

          };

        if (desktopTheme) {

          desktopTheme.addEventListener(
            "click",
            toggleTheme
          );

        }

        if (sidebarTheme) {

          sidebarTheme.addEventListener(
            "click",
            toggleTheme
          );

        }


        /*
         * WELCOME CARDS
         */

        const input =
          document.getElementById(
            "input"
          );

        document.querySelectorAll(
          ".welcome-card[data-prompt]"
        ).forEach(
          (card) => {

            card.addEventListener(
              "click",
              () => {

                if (!input) {
                  return;
                }

                input.value =
                  card.dataset.prompt;

                input.style.height = "auto";

                input.style.height =
                  Math.min(
                    input.scrollHeight,
                    180
                  ) + "px";

                input.focus();

              }
            );

          }
        );

      }
    );

  </script>

</body>
</html>
