  <path d="M80 24v14M51 40l9 9M109 40l-9 9" stroke="#fff" stroke-opacity=".52" stroke-width="1.5" stroke-linecap="round"/>
  <path d="m91 35-39 48h25l-8 42 39-52H83l8-38Z" fill="url(#bolt)" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="m91 35-39 48h25" stroke="#fff" stroke-opacity=".8" stroke-width="1" stroke-linecap="round"/>
  <circle cx="80" cy="80" r="55" stroke="#fff" stroke-opacity=".2" stroke-width="1" stroke-dasharray="3 8"/>
