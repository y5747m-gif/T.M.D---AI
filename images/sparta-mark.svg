      <stop stop-color="#fff"/>
      <stop offset=".48" stop-color="#bbb"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
    <linearGradient id="bolt" x1="79" y1="39" x2="84" y2="121" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".53" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
    <radialGradient id="core" cx=".35" cy=".2" r=".9">
      <stop stop-color="#303030"/>
