<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SPARTA AI lightning mark</title>
  <desc id="desc">A monochrome shield with a precise lightning bolt.</desc>
  <defs>
