<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>theme test</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/astra-theme.css?v=1">
</head>
<body data-theme="dark">
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="sparta-logo sparta-logo--sm"><img src="/images/sparta-mark.svg" width="40" height="40" alt=""></div>
          <div class="brand-info"><div class="brand-name"><span class="brand-text">SPARTA</span><span class="brand-badge-pro">AI</span></div><span class="brand-sub">sub</span></div>
        </div>
      </div>
      <button class="new-chat-btn"><span class="btn-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="btn-label">محادثة جديدة</span><span class="kbd-badge">Ctrl K</span></button>
      <div class="history-header"><span class="history-title">المحادثات</span></div>
      <div class="history-list"><div class="history-item active"><svg></svg><span>conversation one</span></div></div>
      <div class="developer-card"></div>
      <div class="sidebar-footer"><button class="footer-btn"><span class="footer-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg></span><span class="footer-btn-label">الإعدادات</span></button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="topbar-right"><div class="model-selector-wrapper"><select class="model-select"><option>A</option></select></div><div class="status-pill"><span class="status-light"></span><span class="status-name">X</span></div></div><div class="topbar-left"><button class="topbar-action-btn"><span class="topbar-btn-icon"><svg viewBox="0 0 24 24"><path d="M12 3v12"/></svg></span><span class="topbar-btn-text">t</span></button></div></header>
      <section class="chat"><div class="welcome"><div class="sparta-logo sparta-logo--hero"><img src="/images/sparta-mark.svg" width="72" height="72" alt=""></div><h1 class="welcome-title">title</h1><div class="welcome-cards-grid"><button class="welcome-card card--chat"><div class="card-icon-wrap"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg></div><div class="card-text"><strong>x</strong><span>y</span></div></button></div></div></div></section>
      <div class="composer-wrap"><div class="composer-inner"><div class="input-shell"><button class="circle-button plus-toggle-btn"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><textarea class="input-area"></textarea><button class="circle-button send-button"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/></svg></button></div><section class="mode-wheel"><button class="mode-node"><span class="mode-node__icon"><svg viewBox="0 0 24 24"><path d="m6 4 7 7"/></svg></span><span class="mode-node__label">منافسة</span></button></section><div class="composer-note"><span>note</span></div></div></div>
    </main>
  </div>
</body>
</html>
