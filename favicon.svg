<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="seal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111b40"/>
      <stop offset="55%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#050913"/>
    </linearGradient>
    <linearGradient id="seal-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6dd8f"/>
      <stop offset="48%" stop-color="#dfb554"/>
      <stop offset="100%" stop-color="#b8892c"/>
    </linearGradient>
    <linearGradient id="seal-steel" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3e6ff4"/>
      <stop offset="100%" stop-color="#8fb0ff"/>
    </linearGradient>
    <radialGradient id="seal-halo" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#3e6ff4" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#1b2a6b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="seal-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- قاعدة ملكية داكنة -->
  <rect width="100" height="100" rx="27" fill="url(#seal-bg)"/>
  <rect x="2.6" y="2.6" width="94.8" height="94.8" rx="24.5" stroke="url(#seal-gold)" stroke-width="1.8" stroke-opacity="0.9"/>

  <!-- هالة ملكية -->
  <circle cx="50" cy="50" r="35" fill="url(#seal-halo)"/>

  <!-- الشرارة الذهبية المركزية -->
  <path filter="url(#seal-glow)"
        d="M50 20 C51 35 65 49 80 50 C65 51 51 65 50 80 C49 65 35 51 20 50 C35 49 49 35 50 20 Z"
        fill="url(#seal-gold)"/>

  <!-- شرارة تقنية زرقاء صغيرة -->
  <path d="M77 14 C77.5 19.2 81.8 23.5 87 24 C81.8 24.5 77.5 28.8 77 34 C76.5 28.8 72.2 24.5 67 24 C72.2 23.5 76.5 19.2 77 14 Z"
        fill="url(#seal-steel)" opacity="0.95"/>
  <path d="M24.5 67 C24.8 69.9 27.1 72.2 30 72.5 C27.1 72.8 24.8 75.1 24.5 78 C24.2 75.1 21.9 72.8 19 72.5 C21.9 72.2 24.2 69.9 24.5 67 Z"
        fill="#8fb0ff" opacity="0.7"/>
</svg>
